name: Build and Deploy

on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "HUGO_BASE_URL=https://alkemio.org" >> "$GITHUB_ENV"
            echo "BUNNY_STORAGE_ZONE=${{ secrets.BUNNY_STORAGE_ZONE_PROD }}" >> "$GITHUB_ENV"
            echo "BUNNY_STORAGE_API_KEY=${{ secrets.BUNNY_STORAGE_API_KEY_PROD }}" >> "$GITHUB_ENV"
            echo "BUNNY_PULL_ZONE_ID=${{ secrets.BUNNY_PULL_ZONE_ID_PROD }}" >> "$GITHUB_ENV"
          else
            echo "HUGO_BASE_URL=https://draft.alkemio.org" >> "$GITHUB_ENV"
            echo "BUNNY_STORAGE_ZONE=${{ secrets.BUNNY_STORAGE_ZONE_DRAFT }}" >> "$GITHUB_ENV"
            echo "BUNNY_STORAGE_API_KEY=${{ secrets.BUNNY_STORAGE_API_KEY_DRAFT }}" >> "$GITHUB_ENV"
            echo "BUNNY_PULL_ZONE_ID=${{ secrets.BUNNY_PULL_ZONE_ID_DRAFT }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: hugo --gc --minify -b "$HUGO_BASE_URL"
        env:
          HUGO_ENV: production

      - name: Upload to Bunny Storage
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          source: public
          destination: /
          storageZoneName: "${{ env.BUNNY_STORAGE_ZONE }}"
          storagePassword: "${{ env.BUNNY_STORAGE_API_KEY }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          pullZoneId: "${{ env.BUNNY_PULL_ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
