name: Build and Deploy

on:
  push:
    branches: [develop2, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set environment variables
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "hugo_base_url=https://alkemio.org" >> "$GITHUB_OUTPUT"
            echo "hugo_environment=production" >> "$GITHUB_OUTPUT"
            echo "storage_zone=${{ vars.BUNNY_STORAGE_ZONE_PROD }}" >> "$GITHUB_OUTPUT"
            echo "pull_zone_id=${{ vars.BUNNY_PULL_ZONE_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "BUNNY_STORAGE_API_KEY=${{ secrets.BUNNY_STORAGE_API_KEY_PROD }}" >> "$GITHUB_ENV"
          else
            echo "hugo_base_url=https://draft.alkemio.org" >> "$GITHUB_OUTPUT"
            echo "hugo_environment=draft" >> "$GITHUB_OUTPUT"
            echo "storage_zone=${{ vars.BUNNY_STORAGE_ZONE_DRAFT }}" >> "$GITHUB_OUTPUT"
            echo "pull_zone_id=${{ vars.BUNNY_PULL_ZONE_ID_DRAFT }}" >> "$GITHUB_OUTPUT"
            echo "BUNNY_STORAGE_API_KEY=${{ secrets.BUNNY_STORAGE_API_KEY_DRAFT }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: hugo --gc --minify -b "${{ steps.config.outputs.hugo_base_url }}" --environment "${{ steps.config.outputs.hugo_environment }}"

      - name: Upload to Bunny Storage
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          source: public
          destination: /
          storageZoneName: "${{ steps.config.outputs.storage_zone }}"
          storagePassword: "${{ env.BUNNY_STORAGE_API_KEY }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          pullZoneId: "${{ steps.config.outputs.pull_zone_id }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
